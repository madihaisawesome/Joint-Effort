<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Joint Effort — Pose coach</title>
    <link rel="stylesheet" href="/styles.css" />
    <link rel="stylesheet" href="/pose.css" />
  </head>
  <body class="pose-page">
    <header class="pose-header">
      <div>
        <h1>Joint Effort</h1>
        <p>On-device pose coach — video stays in your browser</p>
      </div>
      <nav class="pose-nav">
        <a href="/map.html">Map</a>
        <a href="/viewer.html">API viewer</a>
        <button type="button" id="stop-camera" disabled>Stop camera</button>
      </nav>
    </header>

    <p id="status" class="status-line" role="status">Loading model…</p>
    <p id="guidance" class="guidance" hidden></p>

    <div class="pose-layout">
      <div class="stage">
        <video id="webcam" playsinline autoplay muted></video>
        <canvas id="overlay"></canvas>
      </div>

      <aside class="debug-panel" aria-label="Angle debug panel">
        <h2>Debug angles</h2>
        <dl>
          <div>
            <dt>Left shoulder</dt>
            <dd id="angle-l-shoulder">—</dd>
          </div>
          <div>
            <dt>Right shoulder</dt>
            <dd id="angle-r-shoulder">—</dd>
          </div>
          <div>
            <dt>Left knee</dt>
            <dd id="angle-l-knee">—</dd>
          </div>
          <div>
            <dt>Right knee</dt>
            <dd id="angle-r-knee">—</dd>
          </div>
        </dl>
        <p class="meta">
          Angles update as you move. Low-visibility poses show “step back”
          instead of noisy numbers.
        </p>
      </aside>
    </div>

    <script type="module" src="/pose.js"></script>
  </body>
</html>
