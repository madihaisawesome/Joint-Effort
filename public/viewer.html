<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Joint Effort — API viewer</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header>
      <h1>Joint Effort</h1>
      <p>
        Basic viewer for the backend API ·
        <a href="/">Pose coach</a> ·
        <a href="/map.html">Calgary map</a>
      </p>
      <p id="health" class="status">Checking health…</p>
    </header>

    <main>
      <section>
        <div class="section-head">
          <h2>Curriculum</h2>
          <button type="button" data-action="load-curriculum">Refresh</button>
        </div>
        <div id="curriculum" class="panel">Loading…</div>
      </section>

      <section>
        <div class="section-head">
          <h2>Session</h2>
          <button type="button" data-action="start-session">Start session</button>
        </div>
        <div id="session" class="panel">No session yet.</div>
        <button type="button" id="pass-step" hidden>Mark current step passed</button>
      </section>

      <section>
        <div class="section-head">
          <h2>Programs</h2>
          <button type="button" data-action="load-programs">Refresh</button>
        </div>
        <div id="programs" class="panel">Loading…</div>
      </section>

      <section>
        <div class="section-head">
          <h2>Activity invites</h2>
          <button type="button" data-action="load-buddies">Refresh</button>
        </div>
        <form id="buddy-form">
          <label>Name <input name="name" required maxlength="200" /></label>
          <label>Activity <input name="activity" required maxlength="200" placeholder="Yoga in the park" /></label>
          <label>Place / area <input name="area" required maxlength="200" /></label>
          <label>When <input name="time" required maxlength="200" placeholder="Every Thursday 10am" /></label>
          <label>Details <input name="note" required maxlength="200" /></label>
          <label>Lat <input name="lat" type="number" step="any" placeholder="51.05" /></label>
          <label>Lng <input name="lng" type="number" step="any" placeholder="-114.07" /></label>
          <button type="submit">Post activity invite</button>
        </form>
        <div id="buddies" class="panel">Loading…</div>
      </section>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
